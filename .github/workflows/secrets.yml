name: secret scan

# Scans git history for committed credentials.
#
# Scope and limits, stated plainly so nobody trusts this more than it deserves:
#
#   - This scans commits REACHABLE from refs. betterleaks and gitleaks both run
#     `git log -p --all` under the hood, so a credential that was pushed and
#     then rewritten out of history is NOT detected here. For that case see the
#     forensic section in README.md; the object-store scan is still required.
#   - This is a second line of defence. The first is the local pre-commit hook
#     (.githooks/pre-commit), installed by install.sh.
#   - A finding means a credential is already public. Rotate it. Do not "fix" it
#     by rewriting history: GitHub keeps serving an unreachable object by its
#     SHA, so the value stays retrievable and rotation is the only remediation.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the scan only needs to read the repository.
permissions:
  contents: read

jobs:
  betterleaks:
    name: betterleaks
    runs-on: ubuntu-latest
    env:
      BETTERLEAKS_VERSION: 1.8.1
    steps:
      # Pinned to a commit SHA rather than a moving tag, so a compromised or
      # retagged upstream cannot silently change what runs here.
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, otherwise `git log` sees a single commit and the scan
          # is meaningless.
          fetch-depth: 0

      - name: install betterleaks
        run: |
          set -euo pipefail
          base="https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}"
          asset="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"

          mkdir -p "$RUNNER_TEMP/bl"
          cd "$RUNNER_TEMP/bl"

          curl -sSfLO "${base}/${asset}"
          curl -sSfLO "${base}/checksums.txt"

          # Verify the artifact before executing it. Downloading a security tool
          # and running it unverified is the exact mistake this repo exists to
          # avoid.
          grep --fixed-strings "$asset" checksums.txt \
            | sha256sum --check --strict -

          tar xzf "$asset"
          install -m 0755 betterleaks /usr/local/bin/betterleaks
          betterleaks version

      - name: scan history
        run: |
          set -euo pipefail
          betterleaks git . --redact --no-banner
